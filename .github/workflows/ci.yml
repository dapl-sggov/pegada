name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint + testes + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: node --check
        run: |
          set -euo pipefail
          for f in $(find app/backend/src app/backend/test app/frontend/src -name '*.js'); do
            echo "→ $f"
            node --check "$f"
          done
          node --check demo/demo.js

      - name: Instalar dependências
        working-directory: app/backend
        run: npm install --no-audit --no-fund

      - name: Testes
        working-directory: app/backend
        run: npm test

      - name: Smoke (boot + health + login + canónico + ficha pública)
        working-directory: app/backend
        run: |
          set -euo pipefail
          node src/seed.js
          node src/server.js > /tmp/server.log 2>&1 &
          SRV_PID=$!
          trap "kill $SRV_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 20); do
            curl -sf http://localhost:3717/health > /dev/null && break
            sleep 0.5
          done
          curl -sf http://localhost:3717/health | grep -q '"ok":true'
          # CSRF + login mock
          curl -sf -c /tmp/ck.txt http://localhost:3717/api/auth/csrf > /dev/null
          CSRF=$(grep fpl_csrf /tmp/ck.txt | awk '{print $7}')
          curl -sf -b /tmp/ck.txt -c /tmp/ck.txt -X POST \
            -H "Content-Type: application/json" -H "x-csrf-token: $CSRF" \
            -d '{"email":"maria.silva@maen.gov.pt"}' \
            http://localhost:3717/api/auth/login | grep -q '"email":"maria.silva@maen.gov.pt"'
          # FPL exemplo do seed
          FID=$(curl -sf -b /tmp/ck.txt http://localhost:3717/api/fpl | \
            node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).items[0].id))")
          # JSON canónico
          curl -sf -b /tmp/ck.txt http://localhost:3717/api/fpl/$FID/canonico | grep -q '"schema":"fpl-ponte/v1"'
          # Ficha pública HTML
          curl -sf -b /tmp/ck.txt http://localhost:3717/api/fpl/$FID/ficha-publica | grep -q 'Pegada Legislativa'
          echo "✓ smoke OK"
